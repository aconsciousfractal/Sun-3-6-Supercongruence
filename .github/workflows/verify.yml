name: Exact arithmetic
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -B scripts/check_manifest.py
      - run: python -B scripts/check_manifest.py --evidence
      - run: python -B scripts/verify.py --expected evidence
      - run: python -B -O scripts/verify.py --expected evidence
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -O -m unittest discover -s tests -v
